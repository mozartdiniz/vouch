[package]
name = "vouch"
version = "0.1.0"
edition = "2024"

[dependencies]
cel = "0.14.4"
clap = { version = "4.6.6", features = ["derive"] }
jsonschema = { version = "0.52.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }
toml = "1.1.4"
