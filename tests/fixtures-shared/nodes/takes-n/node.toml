name = "takes-n"
version = "0.1.0"
purpose = "takes an n, so both shared contracts attach"
run = ["python3", "-c", "import sys,json; d=json.load(sys.stdin); print(json.dumps({'n': d.get('n', 1)}))"]
ensures = ["result.n <= 1000"]

[input]
type = "object"
additionalProperties = false

[input.properties.n]
type = "integer"

[output]
type = "object"
additionalProperties = false
required = ["n"]

[output.properties.n]
type = "integer"
