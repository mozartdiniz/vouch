name = "array-out"
version = "0.1.0"
purpose = "Returns a JSON array instead of an object"
run = ["python3", "-c", 'import json; print(json.dumps([1,2,3]))']
ensures = ["result.n >= 0"]

[input]
type = "object"
additionalProperties = false
required = ["n"]

[input.properties.n]
type = "integer"

[output]
type = "object"
additionalProperties = false
required = ["n"]

[output.properties.n]
type = "integer"
