name = "crasher"
version = "0.1.0"
purpose = "Always crashes"
# Exit 1, because that is what an uncaught exception produces in every language a node is
# likely to be written in. It used to exit 3, chosen arbitrarily — which is now the status a
# node uses to refuse, and would have made this fixture assert the opposite of its own name.
run = ["python3", "-c", "import sys; print('boom', file=sys.stderr); sys.exit(1)"]
ensures = ["result.n >= 0"]

[input]
type = "object"
additionalProperties = false
required = ["n"]

[input.properties.n]
type = "integer"

[output]
type = "object"
additionalProperties = false
required = ["n"]

[output.properties.n]
type = "integer"
