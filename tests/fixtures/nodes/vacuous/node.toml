name = "vacuous"
version = "0.1.0"
purpose = "Postcondition checks nothing about the result"
run = ["python3", "-c", "import json; print(json.dumps({'n': 1}))"]
ensures = ["1 == 1"]

[input]
type = "object"
additionalProperties = false
required = ["n"]

[input.properties.n]
type = "integer"

[output]
type = "object"
additionalProperties = false
required = ["n"]

[output.properties.n]
type = "integer"
